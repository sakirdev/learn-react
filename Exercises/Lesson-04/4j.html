<!DOCTYPE html>
<html>

<head>
    <title>Exercise 4j</title>
    <style>
        body {
            font-family: Arial;
            margin-top: 0;
            margin-bottom: 0;
        }

        .app-container {
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-input-container {
            display: flex;
            margin-bottom: 60px;
        }

        .chat-input {
            font-size: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            border-width: 1px;
            margin-right: 10px;
            flex-grow: 1;
        }

        .send-button {
            background-color: rgb(25, 135, 84);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .chat-messages-container {
            flex-grow: 1;
            margin-top: 20px;
            overflow: scroll;
            scrollbar-width: none;
        }

        .chat-message-user {
            display: flex;
            justify-content: end;
            align-items: start;
        }

        .chat-message-robot {
            display: flex;
            align-items: start;
        }

        .chat-message-text {
            background-color: rgb(238, 238, 238);
            padding: 15px 20px;
            border-radius: 10px;
            margin-right: 10px;
            margin-left: 10px;
            margin-bottom: 20px;
            max-width: 300px;
        }

        .chat-message-profile {
            width: 45px;
        }

        .welcome-message {
            color: rgb(120, 120, 120);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState("");
            const [isLoading, setIsLoading] = React.useState(false);

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            function handleKeyDown(event) {
                if (event.key === "Escape" && inputText !== "") {
                    setInputText("");
                } else if (event.key === "Enter" && inputText !== "") {
                    sendMessage();
                }
            }

            async function sendMessage() {
                if (isLoading || inputText === "") {
                    return;
                }

                setIsLoading(true);

                const newChatMessages = [
                    ...chatMessages,
                    {
                        message: inputText,
                        sender: "user",
                        id: crypto.randomUUID()
                    }
                ];

                setChatMessages([
                    ...newChatMessages,
                    {
                        message: "Loading...",
                        sender: "robot",
                        id: crypto.randomUUID()
                    }
                ]);

                setInputText("");

                const response = await Chatbot.getResponseAsync(inputText);

                setChatMessages([
                    ...newChatMessages,
                    {
                        message: response,
                        sender: "robot",
                        id: crypto.randomUUID()
                    }
                ]);

                setIsLoading(false);
            }

            return (
                <div className="chat-input-container">
                    <input
                        className="chat-input"
                        placeholder="Send a message to Chatbot"
                        value={inputText}
                        onChange={saveInputText}
                        onKeyDown={handleKeyDown}
                        size="50"
                    />
                    <button
                        className="send-button"
                        onClick={sendMessage}
                    >Send</button>
                </div>
            );
        }

        function ChatMessages({ chatMessages }) {
            const chatMessagesRef = React.useRef(null);
            React.useEffect(() => {
                const containerElem = chatMessagesRef.current;
                if (containerElem) {
                    containerElem.scrollTop = containerElem.scrollHeight;
                }
            }, [chatMessages]);
            const messages = chatMessages.map((chatMessage) => {
                return (
                    <ChatMessage
                        message={chatMessage.message}
                        sender={chatMessage.sender}
                        key={chatMessage.id}
                    />
                );
            });

            return (
                <div
                    className="chat-messages-container"
                    ref={chatMessagesRef}
                >
                    {messages}
                </div>
            );
        }

        function ChatMessage({ message, sender }) {
            return (
                <div className={sender === "user" ? "chat-message-user" : "chat-message-robot"}>
                    {sender === "robot" &&
                        (<img src="/Exercises/Lesson-04/assets/robot.png" width="50" className="chat-message-profile" />)
                    }
                    <div className="chat-message-text">
                        {message}
                    </div>
                    {sender === "user" &&
                        (<img src="/Exercises/Lesson-04/assets/user.png" width="50" className="chat-message-profile" />)
                    }
                </div>
            );
        }

        function App() {
            const [chatMessages, setChatMessages] = React.useState([]);

            return (
                <div className="app-container">
                    {
                        chatMessages.length === 0 &&
                        (
                            <p
                                className="welcome-message">Welcome to the Chatbot project! Send a message using the textbox below
                            </p>
                        )}
                    <ChatMessages chatMessages={chatMessages} />
                    <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
                </div>
            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
