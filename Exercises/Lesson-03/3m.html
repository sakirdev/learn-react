<!DOCTYPE html>
<html>

<head>
    <title>Exercise 3m</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatInput({ chatMessages, setChatMessages }) {
            const [textInput, setTextInput] = React.useState("");
            const [isLoading, setIsLoading] = React.useState(false);

            function saveTextInput(event) {
                setTextInput(event.target.value);
            }

            function handleKeyDown(event) {
                if (event.key === "Escape" && textInput !== "") {
                    setTextInput("");
                } else if (event.key === "Enter" && textInput !== "") {
                    sendMessage();
                }
            }

            async function sendMessage() {
                if (isLoading || textInput === "") {
                    return;
                }

                setIsLoading(true);

                const newChatMessages = [
                    ...chatMessages,
                    {
                        message: textInput,
                        sender: "user",
                        id: crypto.randomUUID()
                    },
                ];

                setTextInput("");

                setChatMessages([
                    ...newChatMessages,
                    {
                        message: "Loading...",
                        sender: "robot",
                        id: crypto.randomUUID()
                    }
                ]);

                const response = await Chatbot.getResponseAsync(textInput);

                setChatMessages([
                    ...newChatMessages,
                    {
                        message: response,
                        sender: "robot",
                        id: crypto.randomUUID()
                    }
                ]);

                setIsLoading(false);
            }

            return (
                <>
                    <input
                        placeholder="Send a message to Chatbot"
                        size="50"
                        value={textInput}
                        onChange={saveTextInput}
                        onKeyDown={handleKeyDown}
                    />
                    <button
                        onClick={sendMessage}
                        disabled={textInput !== "" ? 0 : 1}
                    >Send</button>
                </>
            );
        }

        function ChatMessages({ chatMessages }) {
            const messages = chatMessages.map((chatMessage) => {
                return (
                    <ChatMessage
                        message={chatMessage.message}
                        sender={chatMessage.sender}
                        key={chatMessage.id}
                    />
                );
            });

            return (
                <>
                    {messages}
                </>
            );
        }

        function ChatMessage({ message, sender }) {
            return (
                <div>
                    {sender === "robot" && <img src="/Exercises/Lesson-03/assets/robot.png" width="50" />}
                    {message}
                    {sender === "user" && <img src="/Exercises/Lesson-03/assets/user.png" width="50" />}
                </div>
            );
        }

        function App() {
            const [chatMessages, setChatMessages] = React.useState([]);

            return (
                <>
                    <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
                    <ChatMessages chatMessages={chatMessages} />
                </>
            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
