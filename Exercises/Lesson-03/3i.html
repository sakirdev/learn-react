<!DOCTYPE html>
<html>

<head>
    <title>Exercise 3i</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatInput({ messages, setMessages }) {

            const [inputText, setInputText] = React.useState("");

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            function sendMessage() {
                const newChatMessages = [
                    ...messages,
                    {
                        message: inputText,
                        sender: "user",
                        id: crypto.randomUUID()
                    }
                ];

                setMessages(newChatMessages);

                const response = Chatbot.getResponse(inputText);

                setMessages([
                    ...newChatMessages,
                    {
                        message: response,
                        sender: "robot",
                        id: crypto.randomUUID()
                    }
                ]);

                setInputText("");
            }

            function handleKeyDown(event) {
                if (event.key === "Enter" && inputText !== "") {
                    sendMessage();
                }
            }

            return (
                <>
                    <input
                        placeholder="Send a message to Chatbot"
                        size="50"
                        onChange={saveInputText}
                        onKeyDown={handleKeyDown}
                        value={inputText}
                    />
                    <button
                        onClick={sendMessage}
                        disabled={inputText !== "" ? 0 : 1}
                    >Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) {
            return (
                <div>
                    {sender === "robot" && <img src="/Exercises/Lesson-03/assets/robot.png" width="50" />}
                    {message}
                    {sender === "user" && <img src="/Exercises/Lesson-03/assets/user.png" width="50" />}
                </div>
            );
        }

        function ChatMessages({ messages }) {
            const chatMessageComponents = messages.map((chatMessage) => {
                return (
                    <ChatMessage
                        message={chatMessage.message}
                        sender={chatMessage.sender}
                        key={chatMessage.id}
                    />
                );
            });

            return (
                <>
                    {chatMessageComponents}
                </>
            );
        }

        function App() {
            const [messages, setMessages] = React.useState([]);
            return (
                <>
                    <ChatInput
                        messages={messages}
                        setMessages={setMessages}
                    />
                    <ChatMessages
                        messages={messages}
                    />
                </>
            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
