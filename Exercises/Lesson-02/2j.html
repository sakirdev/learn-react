<!DOCTYPE html>
<html>

<head>
    <title>Exercise 2j</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ProductDetails({ name, price, discountPrice, imgSrc }) {
            return (
                <div>
                    <img src={imgSrc} width="150" />
                    <p>{name}</p>
                    {discountPrice ? (
                        <>
                            <p><del>Price: ${price}</del></p>
                            <p>Discount Price: ${discountPrice}</p>
                        </>
                    ) : (
                        <p>Price: ${price}</p>
                    )}
                    <button>Add to cart</button>
                </div>
            );
        }

        function App() {
            return (
                <>
                    <ProductDetails
                        name="Cotton Socks"
                        price="10.90"
                        discountPrice="5.45"
                        imgSrc="/Exercises/Lesson-02/assets/cotton-socks.png"
                    />
                    <ProductDetails
                        name="Tennis Balls"
                        price="6.00"
                        imgSrc="/Exercises/Lesson-02/assets/tennis-balls.png"
                    />
                    <ProductDetails
                        name="Plain T-shirt"
                        price="7.99"
                        imgSrc="/Exercises/Lesson-02/assets/plain-t-shirt.png"
                    />
                </>
            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
