<!DOCTYPE html>
<html>

<head>
    <title>Exercise 2g</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ProductDetails(props) {
            const name = props.name;
            const price = props.price;
            const discountPrice = props.discountPrice;
            return (
                <>
                    <p>{name}</p>
                    <p>Price: ${price}</p>
                    {/* line below indicate if discount price exist, display paragraph */}
                    {discountPrice && <p>Discount Price: ${discountPrice}</p>}
                    <button>Add to cart</button>
                </>
            );
        }

        function App() {
            return (
                <>
                    <ProductDetails name="Cotton Socks" price="10.90" discountPrice="5.45" />
                    <ProductDetails name="Tennis Balls" price="6.00" />
                    <ProductDetails name="Plain T-shirt" price="7.99" />
                </>
            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
